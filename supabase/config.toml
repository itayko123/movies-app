# CineSwipe — local Supabase stack (`supabase start` spins this up in Docker:
# Postgres 15 + pgvector, GoTrue auth, Realtime, Studio, and the Deno edge runtime).
project_id = "cineswipe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
# Local mail catcher — email OTPs land here during development.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "cineswipe://"
additional_redirect_urls = ["cineswipe://auth", "https://cineswipe.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# Native "Sign in with Apple" (supabase.auth.signInWithIdToken).
[auth.external.apple]
enabled = true
client_id = "com.cineswipe.app"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# Native Google Sign-In (ID token flow — nonce is handled by the native SDK).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.mood-search]
verify_jwt = true

[functions.duo-match]
verify_jwt = true

[functions.embed-media]
verify_jwt = true

[analytics]
enabled = false
